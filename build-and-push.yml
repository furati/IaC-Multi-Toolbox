---
- name: Build and Push IaC Toolbox
  hosts: localhost
  connection: local
  vars:
    image_name: "iac-toolbox"
    github_user: "furati"

  tasks:
    # Version discovery is centralised in scripts/discover-versions.sh so the
    # Makefile, the CI workflows and this playbook can never drift apart.
    - name: "Discover all tool versions (shared script)"
      ansible.builtin.command: ./scripts/discover-versions.sh all
      register: discover
      changed_when: false

    - name: "Parse discovered versions into a dict"
      ansible.builtin.set_fact:
        versions: >-
          {{ ('{' + (discover.stdout_lines
             | map('regex_replace', '^([^=]+)=(.*)$', '"\1": "\2"')
             | join(', ')) + '}') | from_json }}

    - name: "Compute the image version tag (shared script)"
      ansible.builtin.command: ./scripts/discover-versions.sh tag
      environment: "{{ versions }}"
      register: tag_cmd
      changed_when: false

    - name: "Build Docker Image with OCI Labels"
      community.docker.docker_image:
        name: "{{ image_name }}"
        build:
          path: .
          args:
            DEBIAN_VERSION: "{{ versions.DEBIAN_VERSION }}"
            TERRAFORM_VERSION: "{{ versions.TERRAFORM_VERSION }}"
            PACKER_VERSION: "{{ versions.PACKER_VERSION }}"
            ANSIBLE_VERSION: "{{ versions.ANSIBLE_VERSION }}"
            GOVC_VERSION: "{{ versions.GOVC_VERSION }}"
            TFLINT_VERSION: "{{ versions.TFLINT_VERSION }}"
            ANSIBLE_LINT_VERSION: "{{ versions.ANSIBLE_LINT_VERSION }}"
            REPO_URL: "https://github.com/{{ github_user }}/{{ image_name }}"
        source: build
        force_source: yes
      register: build_result

    - name: "Authenticate with GHCR"
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ github_user }}"
        password: "{{ gh_token }}"
        reauthorize: yes

    - name: "Tag and Push to GitHub Container Registry (GHCR)"
      community.docker.docker_image:
        # 'name' refers to the local source image built in the previous step
        name: "{{ image_name }}:latest"
        # 'repository' defines the target path in the registry
        repository: "ghcr.io/{{ github_user }}/{{ image_name }}"
        tag: "{{ item }}"
        push: yes
        source: local
      loop:
        - "latest"
        - "{{ tag_cmd.stdout }}"
