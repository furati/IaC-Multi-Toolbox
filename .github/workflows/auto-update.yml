---
name: Auto-update tools

on:
  schedule:
    # Daily at 06:17 UTC (off the hour to avoid cron congestion).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write   # Trivy SARIF upload (in build.yml)
  id-token: write          # cosign signing (in build.yml)

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      version_tag: ${{ steps.decide.outputs.version_tag }}
      dind_tag: ${{ steps.decide.outputs.dind_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover latest tool versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/discover-versions.sh all >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Decide whether a new image is needed
        id: decide
        env:
          TOOLBOX_IMAGE: ghcr.io/${{ github.repository_owner }}/iac-toolbox
          DIND_IMAGE: ghcr.io/${{ github.repository_owner }}/dind
        run: |
          TAG="$(./scripts/discover-versions.sh tag)"
          DOCKER_VERSION="$(./scripts/discover-versions.sh docker)"
          DIND_TAG="$(DOCKER_VERSION="$DOCKER_VERSION" ./scripts/discover-versions.sh dind-tag)"
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "dind_tag=${DIND_TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest versions resolve to tags: ${TAG} / ${DIND_TAG}"
          CHANGED=false
          if ! docker manifest inspect "${TOOLBOX_IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "Toolbox ${TOOLBOX_IMAGE}:${TAG} not published yet — build required."
            CHANGED=true
          fi
          if ! docker manifest inspect "${DIND_IMAGE}:${DIND_TAG}" >/dev/null 2>&1; then
            echo "dind ${DIND_IMAGE}:${DIND_TAG} not published yet — build required."
            CHANGED=true
          fi
          if [ "$CHANGED" = "false" ]; then
            echo "Both images already published — nothing to do."
          fi
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      publish: true
    secrets: inherit

  summary:
    needs: [check, publish]
    if: always() && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          {
            echo "### Auto-update result"
            echo "Toolbox tag: \`${{ needs.check.outputs.version_tag }}\`"
            echo "dind tag: \`${{ needs.check.outputs.dind_tag }}\`"
            echo "Publish outcome: ${{ needs.publish.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
