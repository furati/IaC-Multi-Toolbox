---
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs, but never abort an in-progress publish on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  security-events: write   # Trivy SARIF upload (in build.yml)
  id-token: write          # cosign signing (in build.yml)

jobs:
  build-test-publish:
    # Publish on push to main and manual runs; pull requests only build + test.
    uses: ./.github/workflows/build.yml
    with:
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
