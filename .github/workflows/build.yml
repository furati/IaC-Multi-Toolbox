---
# Reusable: build -> test -> (optionally) publish + sign both images
# (iac-toolbox and dind). Called by ci.yml (on push/PR) and auto-update.yml
# (on a schedule).
name: build

on:
  workflow_call:
    inputs:
      publish:
        description: "Build multi-arch and push to GHCR after tests pass"
        type: boolean
        default: false
    outputs:
      version_tag:
        description: "The computed version tag for the toolbox image"
        value: ${{ jobs.toolbox.outputs.version_tag }}
      dind_tag:
        description: "The computed version tag for the dind image"
        value: ${{ jobs.dind.outputs.dind_tag }}

permissions:
  contents: read
  packages: write
  security-events: write   # upload Trivy SARIF to the Security tab
  id-token: write          # cosign keyless (OIDC) signing

jobs:
  toolbox:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/iac-toolbox
    outputs:
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Discover tool versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/discover-versions.sh all >> "$GITHUB_ENV"

      - name: Compute image tag
        id: meta
        run: |
          # Encodes every tool version, so the tag changes when ANY tool changes.
          TAG="$(./scripts/discover-versions.sh tag)"
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed tag: ${TAG}"

      - name: Assemble build args
        run: |
          {
            echo 'BUILD_ARGS<<EOF'
            echo "DEBIAN_VERSION=${DEBIAN_VERSION}"
            echo "TERRAFORM_VERSION=${TERRAFORM_VERSION}"
            echo "PACKER_VERSION=${PACKER_VERSION}"
            echo "ANSIBLE_VERSION=${ANSIBLE_VERSION}"
            echo "GOVC_VERSION=${GOVC_VERSION}"
            echo "TFLINT_VERSION=${TFLINT_VERSION}"
            echo "ANSIBLE_LINT_VERSION=${ANSIBLE_LINT_VERSION}"
            echo "REPO_URL=https://github.com/${{ github.repository }}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # --- Build a single-arch image locally for testing -------------------
      # Multi-arch manifests cannot be --loaded into the runner's daemon, so we
      # build amd64 here, test it, then build+push all platforms (cache reused).
      - name: Build amd64 image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: iac-toolbox:test
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Human-readable HIGH+CRITICAL report (logs only, never fails the build).
      - name: CVE report (trivy, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iac-toolbox:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Machine-readable report for the GitHub Security tab.
      - name: CVE report (trivy, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iac-toolbox:test
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: iac-toolbox
        continue-on-error: true

      # Gate the build on fixable CRITICAL vulnerabilities only. The bundled
      # upstream binaries (terraform/packer/govc/tflint) regularly carry HIGH
      # Go-stdlib CVEs we cannot patch, which would otherwise block every build.
      - name: CVE gate (trivy, fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iac-toolbox:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # RUN_AS_ROOT: the runner workspace contains root-owned files from the
      # trivy steps (.cache/trivy) that the non-root default user cannot stat.
      - name: Lint repo with bundled linters
        run: |
          docker run --rm -e RUN_AS_ROOT=1 -v "$PWD":/workbench -w /workbench iac-toolbox:test yamllint .
          docker run --rm -e RUN_AS_ROOT=1 -v "$PWD":/workbench -w /workbench iac-toolbox:test ansible-lint

      - name: Smoke tests (tool versions)
        run: |
          docker run --rm iac-toolbox:test terraform version | grep -q "v${TERRAFORM_VERSION}"
          docker run --rm iac-toolbox:test packer version | grep -q "${PACKER_VERSION}"
          docker run --rm iac-toolbox:test ansible --version | grep -q "${ANSIBLE_VERSION}"
          docker run --rm iac-toolbox:test govc version | grep -q "${GOVC_VERSION#v}"
          docker run --rm iac-toolbox:test tflint --version | grep -q "${TFLINT_VERSION}"
          docker run --rm iac-toolbox:test molecule --version >/dev/null
          docker run --rm iac-toolbox:test sh -c 'docker --version && xorriso -version'
          docker run --rm iac-toolbox:test ansible-galaxy collection list | grep -q community.vmware
          # Devcontainer expectations: non-root default user with sudo.
          docker run --rm iac-toolbox:test sh -c '[ "$(whoami)" = "dev" ] && sudo true'
          echo "All smoke tests passed."

      # RUN_AS_ROOT: terraform init writes into the runner-owned workspace,
      # which the non-root default user cannot do.
      - name: Functional tests
        run: |
          docker run --rm -e RUN_AS_ROOT=1 -v "$PWD":/workbench -w /workbench iac-toolbox:test sh -c \
            'echo "provider \"local\" {}" > _t.tf && terraform init && rm -rf .terraform* _t.tf'
          docker run --rm -e RUN_AS_ROOT=1 -v "$PWD":/workbench -w /workbench iac-toolbox:test \
            ansible-playbook build-and-push.yml --syntax-check
          echo "All functional tests passed."

      # --- Publish (multi-arch) + sign -------------------------------------
      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Use the workflow's GITHUB_TOKEN (no PAT to expire). Requires the
          # package to be linked to this repo with write access, and repo
          # Actions to have read/write workflow permissions.
          password: ${{ github.token }}

      - name: Build & push multi-arch image
        id: push
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version_tag }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, by digest)
        if: ${{ inputs.publish }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  dind:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dind
    outputs:
      dind_tag: ${{ steps.meta.outputs.dind_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: dind/Dockerfile

      - name: Discover engine version & compute tag
        id: meta
        run: |
          DEBIAN_VERSION="$(./scripts/discover-versions.sh debian)"
          DOCKER_VERSION="$(./scripts/discover-versions.sh docker)"
          TAG="$(DOCKER_VERSION="$DOCKER_VERSION" ./scripts/discover-versions.sh dind-tag)"
          {
            echo "DEBIAN_VERSION=${DEBIAN_VERSION}"
            echo "DOCKER_VERSION=${DOCKER_VERSION}"
          } >> "$GITHUB_ENV"
          echo "dind_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed tag: ${TAG}"

      - name: Assemble build args
        run: |
          {
            echo 'BUILD_ARGS<<EOF'
            echo "DEBIAN_VERSION=${DEBIAN_VERSION}"
            echo "DOCKER_VERSION=${DOCKER_VERSION}"
            echo "REPO_URL=https://github.com/${{ github.repository }}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build amd64 image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dind
          load: true
          platforms: linux/amd64
          tags: dind:test
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CVE report (trivy, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dind:test
          format: sarif
          output: trivy-dind.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-dind.sarif
          category: dind
        continue-on-error: true

      - name: CVE gate (trivy, fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dind:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test (daemon actually starts)
        run: |
          docker run --rm --entrypoint dockerd dind:test --version | grep -q "${DOCKER_VERSION}"
          docker run -d --privileged --name dind-smoke dind:test
          for i in $(seq 1 30); do
            docker exec dind-smoke docker info >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec dind-smoke docker info >/dev/null || { docker logs dind-smoke; exit 1; }
          docker rm -f dind-smoke
          echo "dind daemon came up cleanly."

      # --- Publish (multi-arch) + sign -------------------------------------
      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push multi-arch image
        id: push
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dind
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.dind_tag }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, by digest)
        if: ${{ inputs.publish }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
