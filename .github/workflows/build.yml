---
# Reusable: build -> test -> (optionally) publish + sign the IaC toolbox.
# Called by ci.yml (on push/PR) and auto-update.yml (on a schedule).
name: build

on:
  workflow_call:
    inputs:
      publish:
        description: "Build multi-arch and push to GHCR after tests pass"
        type: boolean
        default: false
    outputs:
      version_tag:
        description: "The computed version tag for the built image"
        value: ${{ jobs.build.outputs.version_tag }}

permissions:
  contents: read
  packages: write
  security-events: write   # upload Trivy SARIF to the Security tab
  id-token: write          # cosign keyless (OIDC) signing

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/iac-toolbox
    outputs:
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

      - name: Discover tool versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/discover-versions.sh all >> "$GITHUB_ENV"

      - name: Compute image tag
        id: meta
        run: |
          # Encodes every tool version, so the tag changes when ANY tool changes.
          TAG="$(./scripts/discover-versions.sh tag)"
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed tag: ${TAG}"

      - name: Assemble build args
        run: |
          {
            echo 'BUILD_ARGS<<EOF'
            echo "ALPINE_VERSION=${ALPINE_VERSION}"
            echo "TERRAFORM_VERSION=${TERRAFORM_VERSION}"
            echo "PACKER_VERSION=${PACKER_VERSION}"
            echo "ANSIBLE_VERSION=${ANSIBLE_VERSION}"
            echo "PYTHON_VERSION=${PYTHON_VERSION}"
            echo "GOVC_VERSION=${GOVC_VERSION}"
            echo "TFLINT_VERSION=${TFLINT_VERSION}"
            echo "ANSIBLE_LINT_VERSION=${ANSIBLE_LINT_VERSION}"
            echo "REPO_URL=https://github.com/${{ github.repository }}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # --- Build a single-arch image locally for testing -------------------
      # Multi-arch manifests cannot be --loaded into the runner's daemon, so we
      # build amd64 here, test it, then build+push all platforms (cache reused).
      - name: Build amd64 image for testing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: iac-toolbox:test
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Human-readable HIGH+CRITICAL report (logs only, never fails the build).
      - name: CVE report (trivy, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iac-toolbox:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Machine-readable report for the GitHub Security tab.
      - name: CVE report (trivy, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iac-toolbox:test
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      # Gate the build on fixable CRITICAL vulnerabilities only. The bundled
      # upstream binaries (terraform/packer/govc/tflint) regularly carry HIGH
      # Go-stdlib CVEs we cannot patch, which would otherwise block every build.
      - name: CVE gate (trivy, fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iac-toolbox:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Lint repo with bundled linters
        run: |
          docker run --rm -v "$PWD":/workbench -w /workbench iac-toolbox:test yamllint .
          docker run --rm -v "$PWD":/workbench -w /workbench iac-toolbox:test ansible-lint

      - name: Smoke tests (tool versions)
        run: |
          docker run --rm iac-toolbox:test terraform version | grep -q "v${TERRAFORM_VERSION}"
          docker run --rm iac-toolbox:test packer version | grep -q "${PACKER_VERSION}"
          docker run --rm iac-toolbox:test ansible --version | grep -q "${ANSIBLE_VERSION}"
          docker run --rm iac-toolbox:test govc version | grep -q "${GOVC_VERSION#v}"
          docker run --rm iac-toolbox:test tflint --version | grep -q "${TFLINT_VERSION}"
          echo "All smoke tests passed."

      - name: Functional tests
        run: |
          docker run --rm -v "$PWD":/workbench -w /workbench iac-toolbox:test sh -c \
            'echo "provider \"local\" {}" > _t.tf && terraform init && rm -rf .terraform* _t.tf'
          docker run --rm -v "$PWD":/workbench -w /workbench iac-toolbox:test \
            ansible-playbook build-and-push.yml --syntax-check
          echo "All functional tests passed."

      # --- Publish (multi-arch) + sign -------------------------------------
      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The package was originally created with the GH_TOKEN PAT, so it is
          # not auto-linked to this repo's GITHUB_TOKEN. Prefer the PAT when set;
          # fall back to GITHUB_TOKEN (works once the package is linked to the repo).
          password: ${{ secrets.GH_TOKEN || github.token }}

      - name: Build & push multi-arch image
        id: push
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version_tag }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, by digest)
        if: ${{ inputs.publish }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
