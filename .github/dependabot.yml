---
version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (and resolves Node runtime
  # deprecations as action maintainers bump their runtimes).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Group only minor/patch bumps so the grouped PR's update-type stays
      # non-major and auto-merge can engage. Major bumps arrive as separate,
      # ungrouped PRs for manual review.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
