---
# hadolint configuration.
# We deliberately do NOT pin apt/pip package versions in the Dockerfile:
# reproducibility is achieved by pinning the Debian base image (DEBIAN_VERSION),
# which fixes every apt-provided package version for a given release. The two
# Python tools that drive the image tag (ansible-core, ansible-lint) ARE pinned
# via build args.
ignored:
  - DL3008  # Pin versions in apt-get install — handled via pinned DEBIAN_VERSION
  - DL3013  # Pin versions in pip — supporting libs float, tag drivers are pinned
  - DL3005  # apt-get upgrade — deliberate, pulls security fixes for base packages

failure-threshold: warning
